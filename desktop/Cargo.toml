[package]
name = "qop-desktop"
version = "0.0.1"
edition = "2024"
publish = false
description = "QOP Desktop: a linked-device qop client built with Rune"

[[bin]]
name = "qop-desktop"
path = "src/main.rs"

[dependencies]
alloy-primitives = { version = "1.7.3", features = ["k256"] }
alloy-sol-types = "1.7.3"
base64 = "0.23.1"
getrandom = "0.3"
if-addrs = "0.15.0"
keyring = { version = "3", default-features = false, features = [
  "apple-native",
] }
# Git tag, not crates.io: the QUIC transport crates of 0.11.6 are unpublished. Bump together with `@minip2p/node`.
minip2p-rs = { git = "https://github.com/deepso7/minip2p", tag = "v0.11.6", default-features = false, features = [
  "quic",
  "relay",
  "std",
] }
qrcode = { version = "0.14.1", default-features = false }
# Rune is pre-release: pin a `dev` rev (never rewritten) and bump deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

# Rune's dependency tree is large; skip full debug info to keep target/ small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
k256 = { version = "0.13.4", features = ["ecdsa"] }
