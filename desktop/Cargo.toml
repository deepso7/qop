[package]
name = "qop-desktop"
version = "0.0.1"
edition = "2024"
publish = false
description = "QOP Desktop: a linked-device qop client built with Rune"

[[bin]]
name = "qop-desktop"
path = "src/main.rs"

[dependencies]
# Rune is pre-release: pin a `dev` rev (never rewritten) and bump deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
