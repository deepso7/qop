engineStrict: true

saveExact: true

catalog:
  effect: 4.1.4
  typescript: 7.0.2

packages:
  - api
  - cli
  - mailbox
  - mobile
  - packages/*
  - web

overrides:
  "@react-native/metro-config": 0.88.1
  "@effect/platform-node-shared": 4.1.4

allowBuilds:
  dtrace-provider: true
  esbuild: true
  msgpackr-extract: false
  protobufjs: true
minimumReleaseAgeExclude:
  - "@minip2p/core@0.15.0"
  - "@minip2p/node-darwin-arm64@0.15.0"
  - "@minip2p/node-darwin-x64@0.15.0"
  - "@minip2p/node-linux-arm64-gnu@0.15.0"
  - "@minip2p/node-linux-arm64-musl@0.15.0"
  - "@minip2p/node-linux-x64-gnu@0.15.0"
  - "@minip2p/node-linux-x64-musl@0.15.0"
  - "@minip2p/node-win32-x64-msvc@0.15.0"
  - "@minip2p/node@0.15.0"
  - "@minip2p/react-native@0.15.0"
  - drizzle-kit@1.0.0-rc.6
  - drizzle-orm@1.0.0-rc.6

permissions:
  blume:
    skills: true
  drizzle-kit:
    skills: true
  expo-sqlite:
    skills: true
  ultracite:
    skills: false
  workerd:
    build: true
